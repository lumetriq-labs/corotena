<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5d6366" />
  <meta name="description" content="テニスのダブルスの組み合わせをスワイプで決める" />
  <title>pairloom</title>
  <link rel="icon" type="image/png" href="./icons/favicon-64-v2.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-v2.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob ball"></div><div class="blob hard"></div><div class="blob grass"></div><div class="blob clay"></div>
  </div>
  <div class="app">
    <header>
      <a class="help-btn glass" href="./about.html" aria-label="組み合わせの決め方">?</a>
      <button class="members-btn glass" id="openMembers" aria-label="メンバー">👥 <span id="memberCount"></span></button>
    </header>

    <div class="stack" id="stack"></div>

    <div class="bar">
      <div class="priority glass" id="priority" role="radiogroup" aria-label="優先">
        <button role="radio" data-p="rest" aria-checked="true">🪑 休み連続なし</button>
        <button role="radio" data-p="variety" aria-checked="false">🤝 ペアかぶりなし</button>
      </div>
    </div>
  </div>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet glass" id="sheet" role="dialog" aria-label="メンバー">
    <div class="grabber"></div>
    <div class="chips" id="chips"></div>
    <form class="sheet-foot" id="addForm">
      <input id="addInput" placeholder="＋ 名前" maxlength="10" autocomplete="off" enterkeyhint="done" aria-label="名前" />
      <div class="seg" id="courtSeg" aria-label="コート数">
        <button type="button" data-v="1">1</button>
        <button type="button" data-v="2">2</button>
        <button type="button" data-v="3">3</button>
        <button type="button" data-v="4">4面</button>
      </div>
    </form>
    <div class="sheet-actions">
      <button type="button" class="reset" id="resetBtn">↺ 1試合目から</button>
      <button type="button" class="reset danger" id="clearBtn">🗑 すべて消す</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
